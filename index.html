<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter)の読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">
                Wallpapers
            </h1>
            <p class="mt-2 text-sm text-slate-500">
                壁紙配布ページ
            </p>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- 壁紙グリッドコンテナ -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

            <!-- ========================================== -->
            <!-- ▼▼▼ ここから下のブロックをコピペして増やします ▼▼▼ -->
            <!-- ========================================== -->
            <article class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-slate-100">
                <!-- 画像部分 -->
                <div class="aspect-[3/4] overflow-hidden bg-slate-200 relative">
                    <!-- srcのURLを変更して画像を指定します -->
                    <img src="media/Yomega.png" 
                         alt="イラスト作品" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out">
                </div>
                
                <!-- テキスト＆ボタン部分 -->
                <div class="p-5 flex flex-col flex-grow">
                    <h2 class="text-lg font-bold text-slate-900 line-clamp-1 text-ellipsis">ヨーヨーガール</h2>
                    <p class="text-sm text-slate-500 mt-1 mb-6 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        氷山トモヒロ
                    </p>
                    
                    <!-- ダウンロードボタン (hrefに画像のURL、download属性で保存時のファイル名を指定) -->
                    <a href="media/Yomega.png" 
                       download="ヨーヨーガール.png" 
                       target="_blank"
                       class="mt-auto flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-xl transition-colors duration-200 focus:ring-4 focus:ring-indigo-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ダウンロード
                    </a>
                </div>
            </article>
            <!-- ========================================== -->
            <!-- ▲▲▲ コピペするブロックはここまで ▲▲▲ -->
            <!-- ========================================== -->
            <article class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-slate-100">
                <!-- 画像部分 -->
                <div class="aspect-[3/4] overflow-hidden bg-slate-200 relative">
                    <!-- srcのURLを変更して画像を指定します -->
                    <img src="media/GirlsSmall.png" 
                         alt="イラスト作品" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out">
                </div>
                
                <!-- テキスト＆ボタン部分 -->
                <div class="p-5 flex flex-col flex-grow">
                    <h2 class="text-lg font-bold text-slate-900 line-clamp-1 text-ellipsis">ツイン</h2>
                    <p class="text-sm text-slate-500 mt-1 mb-6 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        氷山トモヒロ
                    </p>
                    
                    <!-- ダウンロードボタン (hrefに画像のURL、download属性で保存時のファイル名を指定) -->
                    <a href="media/GirlsSmall.png" 
                       download="ツイン.png" 
                       target="_blank"
                       class="mt-auto flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-xl transition-colors duration-200 focus:ring-4 focus:ring-indigo-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ダウンロード
                    </a>
                </div>
            </article>
            <article class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-slate-100">
                <!-- 画像部分 -->
                <div class="aspect-[3/4] overflow-hidden bg-slate-200 relative">
                    <!-- srcのURLを変更して画像を指定します -->
                    <img src="media/retoro.jpg" 
                         alt="イラスト作品" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out">
                </div>
                
                <!-- テキスト＆ボタン部分 -->
                <div class="p-5 flex flex-col flex-grow">
                    <h2 class="text-lg font-bold text-slate-900 line-clamp-1 text-ellipsis">80ラッパー</h2>
                    <p class="text-sm text-slate-500 mt-1 mb-6 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        氷山トモヒロ
                    </p>
                    
                    <!-- ダウンロードボタン (hrefに画像のURL、download属性で保存時のファイル名を指定) -->
                    <a href="media/retoro.jpg" 
                       download="80ラッパー.jpg" 
                       target="_blank"
                       class="mt-auto flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-xl transition-colors duration-200 focus:ring-4 focus:ring-indigo-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ダウンロード
                    </a>
                </div>
            </article>
            <article class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-slate-100">
                <!-- 画像部分 -->
                <div class="aspect-[3/4] overflow-hidden bg-slate-200 relative">
                    <!-- srcのURLを変更して画像を指定します -->
                    <img src="media/street_girl.png" 
                         alt="イラスト作品" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out">
                </div>
                
                <!-- テキスト＆ボタン部分 -->
                <div class="p-5 flex flex-col flex-grow">
                    <h2 class="text-lg font-bold text-slate-900 line-clamp-1 text-ellipsis">ストリートガール</h2>
                    <p class="text-sm text-slate-500 mt-1 mb-6 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        氷山トモヒロ
                    </p>
                    
                    <!-- ダウンロードボタン (hrefに画像のURL、download属性で保存時のファイル名を指定) -->
                    <a href="media/street_girl.png" 
                       download="ストリートガール.png" 
                       target="_blank"
                       class="mt-auto flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-xl transition-colors duration-200 focus:ring-4 focus:ring-indigo-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ダウンロード
                    </a>
                </div>
            </article>

        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-slate-500 text-sm">
                &copy; 2026 Tomohiro Hiyama. All rights reserved.
            </p>
        </div>
    </footer>

</body>
</html>
